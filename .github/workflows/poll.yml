name: 국회 의안 폴링

on:
  schedule:
    # 6시간마다. 의안 처리 속도를 감안한 절충값 — 너무 잦으면 Actions 분만 태운다.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    # ubuntu-latest(호스팅 러너)가 open.assembly.go.kr 에 연결하지 못해(2026-08-13
    # 실측, ConnectTimeoutError) 이 PC를 self-hosted 러너로 등록해 여기서 돌린다.
    runs-on: [self-hosted, windows, korea-net]
    defaults:
      run:
        # self-hosted 러너는 NETWORK SERVICE 계정으로 도는데, 그 PATH 에는 Git Bash
        # 가 없다("bash: command not found", 2026-08-13 실측) — 전체 경로로 지정한다.
        shell: 'C:\Program Files\Git\usr\bin\bash.exe {0}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/poll.mjs
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bills/ index.json
          git diff --cached --quiet || git commit -m "poll: 의안 이벤트 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
