name: 국회 의안 폴링

on:
  schedule:
    # 6시간마다. 의안 처리 속도를 감안한 절충값 — 너무 잦으면 Actions 분만 태운다.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    # ubuntu-latest(호스팅 러너)가 open.assembly.go.kr 에 연결하지 못해(2026-08-13
    # 실측, ConnectTimeoutError) self-hosted 러너로 돌린다.
    # 기존: Windows PC 러너 (shell: powershell)
    # 2026-08-15: VPS Linux 러너 추가 — PC가 꺼져도 폴링이 계속됨.
    #
    # 🔴 **Linux 라벨을 빼지 마라.** 2026-08-15~20 사이 폴링이 계속 실패한 원인이
    # 이것이다. `korea-net` 라벨은 Windows PC 러너(user-pc-bill-watch-feed)와
    # VPS 러너(vps-linux)가 **둘 다** 가지고 있는데, 아래 `shell: bash` 는 Windows
    # 러너에 bash 가 PATH 에 없어서 첫 스텝부터 죽는다:
    #     ##[error]bash: command not found   ← 약 20초 만에 실패
    # 「어느 쪽이든 잡는다」가 아니라 **동전던지기**였고, 빠른 쪽(놀고 있던 Windows)이
    # 거의 매번 먼저 집어갔다. `gh run list` 로 보면 8/17~8/20 예약 실행이 전부
    # 20초짜리 실패다. Linux 를 명시해서 VPS 러너만 받게 한다.
    runs-on: [self-hosted, korea-net, Linux]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/poll.mjs
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      # poll.mjs는 "최신 50건"만 앞으로 쌓는다 — 과거 의안(오너 지시
      # 2026-08-15: 윤석열정부 취임일부터)은 이 스텝이 회차마다 조금씩
      # 뒤로 채운다. backfill-state.json에 진행 상황을 남겨 이어간다.
      - run: node scripts/backfill-bills.mjs
        continue-on-error: true
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      - run: node scripts/poll-decrees.mjs
        env:
          LAWGO_OC: ${{ secrets.LAWGO_OC }}
      - run: node scripts/poll-law-history.mjs
        env:
          LAWGO_OC: ${{ secrets.LAWGO_OC }}
      - run: node scripts/poll-gwanbo.mjs
      - run: node scripts/poll-policy.mjs
      # 한국갤럽 사이트 구조가 바뀌면 파싱이 깨질 수 있다 — 그래도 위의
      # 확립된 폴러들(의안·대통령령·법령이력)까지 막히면 안 되므로 이 한
      # 걸음만 실패를 허용한다(2026-08-14, 지지율 파일럿).
      - run: node scripts/poll-approval.mjs
        continue-on-error: true
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bills/ decrees/ laws/ gwanbo/ policy/ index.json approval.json backfill-state.json
          git diff --cached --quiet
          if [ $? -ne 0 ]; then
            ts=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            git commit -m "poll: 의안 이벤트 갱신 $ts"
            git push
          fi
