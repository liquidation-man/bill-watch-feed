name: 국회 의안 폴링

on:
  schedule:
    # 6시간마다. 의안 처리 속도를 감안한 절충값 — 너무 잦으면 Actions 분만 태운다.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    # ubuntu-latest(호스팅 러너)가 open.assembly.go.kr 에 연결하지 못해(2026-08-13
    # 실측, ConnectTimeoutError) 이 PC를 self-hosted 러너로 등록해 여기서 돌린다.
    # bash 를 shell 로 지정하면 러너 서비스 계정(NETWORK SERVICE) PATH 에 Git Bash 가
    # 없어서 실패했다(2026-08-13 실측). pwsh(PowerShell 7)도 이 PC엔 없다 — 이 PC는
    # Windows PowerShell 5.1(powershell.exe)만 있다. 그래서 shell: powershell 을 쓴다.
    runs-on: [self-hosted, windows, korea-net]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/poll.mjs
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      # poll.mjs는 "최신 50건"만 앞으로 쌓는다 — 과거 의안(오너 지시
      # 2026-08-15: 윤석열정부 취임일부터)은 이 스텝이 회차마다 조금씩
      # 뒤로 채운다. backfill-state.json에 진행 상황을 남겨 이어간다.
      - run: node scripts/backfill-bills.mjs
        continue-on-error: true
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      - run: node scripts/poll-decrees.mjs
        env:
          LAWGO_OC: ${{ secrets.LAWGO_OC }}
      - run: node scripts/poll-law-history.mjs
        env:
          LAWGO_OC: ${{ secrets.LAWGO_OC }}
      # 한국갤럽 사이트 구조가 바뀌면 파싱이 깨질 수 있다 — 그래도 위의
      # 확립된 폴러들(의안·대통령령·법령이력)까지 막히면 안 되므로 이 한
      # 걸음만 실패를 허용한다(2026-08-14, 지지율 파일럿).
      - run: node scripts/poll-approval.mjs
        continue-on-error: true
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bills/ decrees/ laws/ index.json approval.json backfill-state.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $ts = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            git commit -m "poll: 의안 이벤트 갱신 $ts"
            git push
          }
