name: 국회 의안 폴링

on:
  schedule:
    # 6시간마다. 의안 처리 속도를 감안한 절충값 — 너무 잦으면 Actions 분만 태운다.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/poll.mjs
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bills/ index.json
          git diff --cached --quiet || git commit -m "poll: 의안 이벤트 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
